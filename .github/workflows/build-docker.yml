name: Build CookieCloud Docker Image
#触发方式：推送到master分支、也支持网页手动点按钮运行
on:
  push:
    branches: [ master ]
  workflow_dispatch: #开启【手动点击运行】按钮！非常重要

permissions:
  contents: read
  packages: write    #允许上传镜像到GHCR仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up QEMU (多架构支持 amd64/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner name
        run: echo "OWNER_LC=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build & Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          #镜像地址 ghcr.io/你的用户名/cookiecloud:latest
          tags: ghcr.io/5235click/cookiecloud:202608
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
